name: Build Android APK & GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release Name (optional)'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies in app
        working-directory: ./app
        run: |
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild Android
        working-directory: ./app
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: ./app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Locate & Rename APK
        id: apk_file
        run: |
          APK_PATH=$(find app/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          
          VERSION_TAG="${{ github.ref_name }}"
          if [[ ! "$VERSION_TAG" =~ ^v ]]; then
            VERSION_TAG="v1.0.0-${{ github.run_number }}"
          fi
          
          OUTPUT_APK="Quest-Overworld-${VERSION_TAG}.apk"
          cp "$APK_PATH" "./$OUTPUT_APK"
          echo "apk_path=./$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "Built APK: $OUTPUT_APK"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quest-overworld-apk
          path: ${{ steps.apk_file.outputs.apk_path }}
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk_file.outputs.apk_path }}
          name: ${{ inputs.release_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
