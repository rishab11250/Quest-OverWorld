name: Build Android APK & GitHub Release

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.9-beta)'
        required: false
        default: ''

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies in client
        working-directory: ./client
        run: |
          pnpm install --no-frozen-lockfile

      - name: Expo Prebuild Android
        working-directory: ./client
        run: |
          npx expo prebuild --platform android --clean

      - name: Build Android Release APK
        working-directory: ./client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint -x test

      - name: Locate & Rename APK
        id: apk_file
        run: |
          APK_PATH=$(find client/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi

          TAG_INPUT="${{ inputs.tag_name }}"
          REF_NAME="${{ github.ref_name }}"

          if [ -n "$TAG_INPUT" ]; then
            VERSION_TAG="$TAG_INPUT"
          elif [ -n "$REF_NAME" ] && [ "$REF_NAME" != "main" ] && [ "$REF_NAME" != "master" ]; then
            VERSION_TAG="$REF_NAME"
          else
            VERSION_TAG="v1.0.0-build-${{ github.run_number }}"
          fi

          OUTPUT_APK="Quest-Overworld.apk"
          cp "$APK_PATH" "./$OUTPUT_APK"
          echo "apk_path=./$OUTPUT_APK" >> $GITHUB_OUTPUT
          echo "version_tag=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Built APK: $OUTPUT_APK for release $VERSION_TAG"

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quest-Overworld
          path: ${{ steps.apk_file.outputs.apk_path }}
          retention-days: 14

      - name: Upload APK Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.apk_file.outputs.version_tag }}
          files: ${{ steps.apk_file.outputs.apk_path }}
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
